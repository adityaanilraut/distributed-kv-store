name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  raft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make test
      - run: go vet ./...
      - run: docker build -t portfolio-raft:ci .
