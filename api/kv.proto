syntax = "proto3";
package kv.v1;

option go_package = "github.com/adityaanilraut/distributed-kv-store/api";

service KeyValue {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (WriteResponse);
  rpc Delete(DeleteRequest) returns (WriteResponse);
}

message GetRequest { string key = 1; }
message GetResponse {
  bool found = 1;
  bytes value = 2;
  uint64 index = 3;
}
message PutRequest {
  string key = 1;
  bytes value = 2;
}
message DeleteRequest { string key = 1; }
message WriteResponse { uint64 index = 1; }
