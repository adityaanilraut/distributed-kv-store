apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [monitoring.yaml]
configMapGenerator:
  - name: prometheus-config
    files: [prometheus.yml]
  - name: grafana-datasource
    files: [datasource.yaml]
  - name: grafana-provider
    files: [provider.yaml]
  - name: grafana-dashboard
    files: [raft.json]
