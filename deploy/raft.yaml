apiVersion: v1
kind: Service
metadata:
  name: raft
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: raft
  ports:
    - {name: peer, port: 8080}
    - {name: grpc, port: 50051}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: raft
spec:
  serviceName: raft
  replicas: 5
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: raft
  template:
    metadata:
      labels:
        app: raft
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 5
      containers:
        - name: raft
          image: portfolio-raft:local
          imagePullPolicy: Never
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - {name: DATA_FILE, value: /data/raft.db}
            - {name: DEMO_FAULTS, value: "1"}
          ports:
            - {name: peer, containerPort: 8080}
            - {name: grpc, containerPort: 50051}
          readinessProbe:
            httpGet: {path: /status, port: peer}
            periodSeconds: 2
          volumeMounts:
            - {name: data, mountPath: /data}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: raft-bench
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: raft-bench
rules:
  - apiGroups: [""]
    resources: ["pods"]
    resourceNames: ["raft-0", "raft-1", "raft-2", "raft-3", "raft-4"]
    verbs: ["delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: raft-bench
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: raft-bench}
subjects:
  - {kind: ServiceAccount, name: raft-bench}
